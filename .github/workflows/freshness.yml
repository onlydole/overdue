# Documentation Freshness
#
# Scores every doc page on a 0-100 scale from three deterministic signals
# (git age delta, frontmatter TTL, symbol drift), posts a sticky PR comment
# with per-page deltas, and fails the build on SLO breach:
#   - median across non-excluded pages < 75
#   - any critical: true page < 60
#
# Pages in the 35-64 gray zone are routed to a conditional Claude semantic
# check that reports STILL_ACCURATE / DRIFTED / NEEDS_HUMAN_REVIEW per page.
#
# Required secret: ANTHROPIC_API_KEY (only consumed for trusted non-PR runs when
# the gray-zone count > 0)
#
# Security choices:
#   - Top-level permissions: {} denies the default GITHUB_TOKEN scope. Jobs
#     opt in to only what they need.
#   - Third-party actions are pinned to a commit SHA with the tag in a
#     trailing comment so Dependabot can pick up upgrades and a reviewer
#     can read intent at a glance.
#   - Untrusted PR base ref is routed through env before reaching any shell.
#     fetch-depth: 0 is required for the git age signal. The PR scoring job
#     has no write permission and never receives repository secrets.
#   - PR comments run in a separate write-scoped job that only consumes
#     sanitized freshness artifacts; it never checks out or executes PR code.

name: Documentation Freshness

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/scripts/freshness.py'
      - '.github/freshness-allowlist.txt'
      - '.github/workflows/freshness.yml'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: docs-freshness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — git age signal needs full history
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Compute freshness
        id: fresh
        run: |
          set -euo pipefail
          uv run python .github/scripts/freshness.py
          cp freshness.json freshness.current.json
          python <<'PY' >> "$GITHUB_OUTPUT"
          import json, statistics
          data = json.load(open('freshness.current.json'))
          scores = [r['score'] for r in data]
          median = int(statistics.median(scores)) if scores else 100
          print(f'median={median}')
          print(f'page_count={len(scores)}')
          PY

      - name: Upload freshness report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freshness-report
          path: freshness.current.json
          retention-days: 30

      - name: Compute baseline freshness
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add --force /tmp/freshness-base "origin/$BASE_REF"
          if [ -f /tmp/freshness-base/.github/scripts/freshness.py ]; then
            (cd /tmp/freshness-base && uv run python .github/scripts/freshness.py)
            cp /tmp/freshness-base/freshness.json freshness.main.json
          else
            echo "::notice::freshness.py not on $BASE_REF; using empty baseline"
            echo "[]" > freshness.main.json
          fi
          git worktree remove --force /tmp/freshness-base

      - name: Upload baseline report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freshness-baseline
          path: freshness.main.json
          retention-days: 30

      - name: Identify gray-zone pages
        id: gray
        run: |
          set -euo pipefail
          jq -r '.[] | select(.score >= 35 and .score < 65) | .path' \
            freshness.current.json > /tmp/gray.txt
          count=$(jq '[.[] | select(.score >= 35 and .score < 65)] | length' freshness.current.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Claude semantic check
        if: github.event_name != 'pull_request' && steps.gray.outputs.count != '0'
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 # v1.0.120
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Glob,Grep"
            --model claude-sonnet-4-6
          prompt: |
            Read each page listed in /tmp/gray.txt and the source files in its
            frontmatter `sources` block. For each, decide whether the
            documented behavior still matches the code. Respond with one of
            STILL_ACCURATE, DRIFTED, or NEEDS_HUMAN_REVIEW and a one-line reason.

      - name: SLO gate
        run: |
          set -euo pipefail
          python <<'PY'
          import json, statistics, sys
          data = json.load(open('freshness.current.json'))
          scores = [r['score'] for r in data]
          if not scores:
              print('::notice::No pages scored; SLO check skipped')
              sys.exit(0)
          median = statistics.median(scores)
          failed = False
          if median < 75:
              print(f'::error::Median freshness {int(median)} below SLO floor 75')
              failed = True
          for r in data:
              if r.get('critical') and r['score'] < 60:
                  print(f'::error::Critical page {r["path"]} score {r["score"]} below floor 60')
                  failed = True
          if failed:
              sys.exit(1)
          print(f'::notice::Docs freshness OK (median={int(median)}, pages={len(scores)})')
          PY
  pr-comment:
    needs: freshness
    if: ${{ github.event_name == 'pull_request' && always() && needs.freshness.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download freshness report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: freshness-report
          path: /tmp/freshness-current

      - name: Download baseline report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: freshness-baseline
          path: /tmp/freshness-baseline

      - name: Build PR comment body
        run: |
          set -euo pipefail
          python - --current /tmp/freshness-current/freshness.current.json \
            --baseline /tmp/freshness-baseline/freshness.main.json <<'PY' > /tmp/comment.md
          import argparse
          import json
          import re
          import statistics
          import sys
          from pathlib import Path

          SAFE_PATH = re.compile(r"^docs/[A-Za-z0-9._/-]+\.md$")
          SAFE_SYMBOL = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*$")

          def load_report(path):
              raw = json.loads(Path(path).read_text())
              if not isinstance(raw, list):
                  return []

              records = []
              for item in raw:
                  if not isinstance(item, dict):
                      continue
                  doc_path = item.get("path")
                  score = item.get("score")
                  if not isinstance(doc_path, str) or not SAFE_PATH.fullmatch(doc_path):
                      continue
                  if ".." in Path(doc_path).parts:
                      continue
                  if type(score) is not int or score < 0 or score > 100:
                      continue
                  missing = item.get("missing_symbols", [])
                  records.append(
                      {
                          "path": doc_path,
                          "score": score,
                          "missing_symbols": [
                              s for s in missing if isinstance(s, str) and SAFE_SYMBOL.fullmatch(s)
                          ]
                          if isinstance(missing, list)
                          else [],
                          "ttl_days": item.get("ttl_days"),
                          "doc_age_days": item.get("doc_age_days", 0),
                          "source_age_days": item.get("source_age_days", 0),
                      }
                  )
              return records

          def median(records):
              scores = [r["score"] for r in records]
              return int(statistics.median(scores)) if scores else 100

          def reason_for(current, baseline):
              current_missing = {s for s in current["missing_symbols"] if isinstance(s, str)}
              baseline_missing = {s for s in baseline["missing_symbols"] if isinstance(s, str)}
              new_missing = sorted(current_missing - baseline_missing)
              if new_missing:
                  return f"signature drift on {new_missing[0]}"

              ttl = current["ttl_days"]
              age = current["doc_age_days"]
              if isinstance(ttl, int) and isinstance(age, int) and ttl and age > ttl:
                  return f"TTL exceeded by {age - ttl} days"

              if (
                  isinstance(current["source_age_days"], int)
                  and isinstance(baseline["source_age_days"], int)
                  and current["source_age_days"] < baseline["source_age_days"]
              ):
                  return "referenced source files were edited"

              return "score decreased"

          def compute_diff(current, baseline):
              baseline_by_path = {r["path"]: r for r in baseline}
              drops = []
              for record in current:
                  before = baseline_by_path.get(record["path"])
                  if before is None or record["score"] >= before["score"]:
                      continue
                  drops.append(
                      {
                          "path": record["path"],
                          "before": before["score"],
                          "after": record["score"],
                          "reason": reason_for(record, before),
                          "delta": record["score"] - before["score"],
                      }
                  )
              drops.sort(key=lambda item: (item["delta"], item["path"]))
              current_median = median(current)
              baseline_median = median(baseline)
              return {
                  "current_median": current_median,
                  "baseline_median": baseline_median,
                  "delta": current_median - baseline_median,
                  "drops": drops,
              }

          def render(diff):
              delta = diff["delta"]
              sign = "+" if delta >= 0 else ""
              lines = [
                  f"Documentation freshness: {diff['baseline_median']} -> "
                  f"{diff['current_median']} ({sign}{delta})",
                  "",
              ]
              drops = diff["drops"]
              if not drops:
                  lines.append("No pages dropped.")
              else:
                  lines.append(f"{len(drops)} pages dropped:")
                  path_col = max(len(item["path"]) for item in drops) + 7
                  for item in drops:
                      lines.append(
                          f"  {item['path']:<{path_col}}"
                          f"{item['before']} -> {item['after']}  ({item['reason']})"
                      )
              return "\n".join(lines) + "\n"

          def main(argv=None):
              parser = argparse.ArgumentParser(description="Render sanitized freshness deltas")
              parser.add_argument("--current", type=Path, required=True)
              parser.add_argument("--baseline", type=Path, required=True)
              args = parser.parse_args(argv)
              current = load_report(args.current)
              baseline = load_report(args.baseline)
              sys.stdout.write(render(compute_diff(current, baseline)))
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          cat /tmp/comment.md

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: docs-freshness
          path: /tmp/comment.md
